# Builds recipe/Dockerfile with scripts/build-image.sh and pushes the image
# by digest, untagged, so that two builds on different days and machines
# can be compared. It starts only by hand. A self-hosted runner takes any
# queued job whose labels it carries, from any workflow, a pull request's
# included. What keeps a pull request's code off the rented machine is the
# repository's setting that the workflows of every outside contributor's
# pull request wait for a maintainer's approval, and that the machine's
# runner takes a single job and is started only after this workflow is
# dispatched.
name: Build image

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "github: a GitHub-hosted runner; rented: the self-hosted runner"
        type: choice
        options:
          - github
          - rented
        default: github

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ inputs.runner == 'rented' && fromJSON('["self-hosted", "rowkeydb-image-build"]') || 'ubuntu-24.04' }}
    timeout-minutes: 180
    steps:
      - name: Free disk space
        if: inputs.runner == 'github'
        # Makes room for the image, 11.7 GB unpacked, and BuildKit's state;
        # these preinstalled toolchains are not used.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Keep credentials and temporary files in the job's directory
        # The runner empties it when the job ends, so that no credential
        # stays on a self-hosted runner's machine.
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Log in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push
        run: scripts/build-image.sh registry > digest.txt
      - name: Report the digest
        run: |
          cat digest.txt
          echo "linux/amd64 image $(cat digest.txt), built on $RUNNER_NAME, kernel $(uname -r)" >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of the registry
        if: always()
        run: docker logout ghcr.io
