# Checks this repository's own copies on every change.
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    # The image the consumers build in, so that shellcheck and the tools
    # check.sh uses are the versions it fixes, not the runner's.
    container:
      image: ghcr.io/rowkeydb-com/rowkeydb-build-infra@sha256:8acf5b2febb45185469a30b5e47d1601a611f21e637e17f2e109abe86a69ab97
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No later step needs the token.
          persist-credentials: false
      - name: Trust the checkout
        # The checkout belongs to the runner's user and the job runs as root,
        # so git refuses it; actions/checkout trusts it in its own step only.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Lint the scripts
        run: shellcheck scripts/*.sh evidence/*.sh
      - name: Lint the evidence tools
        run: ruff check --no-cache evidence/
      - name: Check the references to the image
        run: scripts/check.sh --self
