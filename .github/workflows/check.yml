# Checks this repository's own copies, its Go code and its BUILD files on
# every change.
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    # The image the consumers build in, so that shellcheck and the tools
    # check.sh uses are the versions it fixes, not the runner's.
    container:
      image: ghcr.io/rowkeydb-com/rowkeydb-build-infra@sha256:c811e74114ebedf787178468c9a796e4e37ae7e55f2d2fdc63501ea940c04515
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No later step needs the token.
          persist-credentials: false
      - name: Trust the checkout
        # The checkout belongs to the runner's user and the job runs as root,
        # so git refuses it; actions/checkout trusts it in its own step only.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Lint the scripts
        run: shellcheck scripts/*.sh evidence/*.sh
      - name: Lint the evidence tools
        run: ruff check --no-cache evidence/
      - name: Check the references to the image
        run: scripts/check.sh --self

  go:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/rowkeydb-com/rowkeydb-build-infra@sha256:c811e74114ebedf787178468c9a796e4e37ae7e55f2d2fdc63501ea940c04515
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No later step needs the token.
          persist-credentials: false
      # Each step runs in the image, as the runner's user, as the consumers'
      # scripts run it. The Bazel steps keep Bazel's output and caches in
      # one directory of the runner, so the second reuses the first's work.
      - name: Make the directory of Bazel's output
        run: mkdir -p "$RUNNER_TEMP/cache"
      - name: Check the formatting of the Go code
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            "$IMAGE" bash -c 'unformatted="$(gofmt -l go)"; [ -z "$unformatted" ] || { echo "gofmt would change: $unformatted"; exit 1; }'
      - name: Build nogo and check the Go code with it
        # Builds every target, nogo among them, and so checks this
        # repository's own Go with nogo, with the shared options, which
        # this repository's .bazelrc imports.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e USER=rowkeydb-build-infra \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -v "$RUNNER_TEMP/cache:/tmp/.cache" \
            "$IMAGE" bazel build //...
      - name: Check the BUILD files with Gazelle
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e USER=rowkeydb-build-infra \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -v "$RUNNER_TEMP/cache:/tmp/.cache" \
            "$IMAGE" bazel test //bazel/gazelle:gazelle_test
